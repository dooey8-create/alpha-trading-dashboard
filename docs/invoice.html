<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f4f5f7;color:#1f2430}
@media(prefers-color-scheme:dark){body{background:#15181f;color:#e8eaed}.box{background:#1e222b!important;box-shadow:0 6px 24px rgba(0,0,0,.5)!important}input[type=password]{background:#12151b!important;color:#e8eaed!important;border-color:#333a47!important}}
.box{background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.10);padding:34px 30px;width:300px;text-align:center}
h1{font-size:17px;margin:0 0 4px}p.sub{font-size:12px;color:#8a919e;margin:0 0 18px}
input[type=password]{width:100%;box-sizing:border-box;font-size:16px;padding:11px 12px;border:1.5px solid #d6dae2;border-radius:9px;outline:none}
input[type=password]:focus{border-color:#3b82f6}
label{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;color:#8a919e;margin:12px 0}
button{width:100%;font-size:15px;font-weight:700;padding:11px;border:0;border-radius:9px;background:#3b82f6;color:#fff;cursor:pointer}
button:disabled{opacity:.55}
#msg{font-size:12px;color:#ef4444;min-height:16px;margin:10px 0 0}
</style></head><body>

<script>
const CFG={salt:"b7/BaE5sIf4GSq8OTGW3Qw==",iv:"qMVvM+0EnA0OF6bM",it:300000};
const KEYNAME="at_gate_k";
const b2u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const u2b=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function keyFromPw(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return await crypto.subtle.deriveBits({name:"PBKDF2",salt:b2u(CFG.salt),iterations:CFG.it,hash:"SHA-256"},base,256);
}
async function tryOpen(rawBits){
  const key=await crypto.subtle.importKey("raw",rawBits,"AES-GCM",false,["decrypt"]);
  const ct=b2u(document.getElementById("ct").textContent.trim());
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(CFG.iv)},key,ct);
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
window.addEventListener("DOMContentLoaded",async()=>{
  const saved=localStorage.getItem(KEYNAME);
  if(saved){try{await tryOpen(b2u(saved).buffer);return}catch(e){localStorage.removeItem(KEYNAME)}}
});
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const btn=document.getElementById("btn"),msg=document.getElementById("msg");
  btn.disabled=true;msg.textContent="확인 중...";msg.style.color="#8a919e";
  try{
    const raw=await keyFromPw(document.getElementById("pw").value);
    if(document.getElementById("rm").checked)localStorage.setItem(KEYNAME,u2b(raw));
    await tryOpen(raw);
  }catch(e){
    localStorage.removeItem(KEYNAME);
    msg.style.color="#ef4444";msg.textContent="비밀번호가 틀렸습니다";
    btn.disabled=false;
  }
});
</script></body></html>
